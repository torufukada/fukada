[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uvxy-detector"
version = "0.1.0"
description = "UVXY early crisis detection toolkit with backtest and HTML reporting"
authors = [{ name = "Auto-generated" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]
